name: Build ConfNav Release APK and AAB

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate release secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD MAPS_API_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required repository secret $name is not configured."
              exit 1
            fi
          done

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -eu
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.p12"
          test -s "$RUNNER_TEMP/release.p12"

      - name: Configure Google Maps API key
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: printf 'MAPS_API_KEY=%s\n' "$MAPS_API_KEY" > .env

      - name: Build signed release APKs and AABs
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.p12
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew clean testDebugUnitTest assembleRelease bundleRelease --no-daemon

      - name: Prepare release packages
        run: |
          set -eu
          mkdir -p dist/apk dist/play
          apk_path="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$apk_path" || { echo "No release APK was produced"; exit 1; }
          cp "$apk_path" dist/apk/ConfNav-release.apk
          wear_apk_path="$(find wear/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$wear_apk_path" || { echo "No Wear OS release APK was produced"; exit 1; }
          cp "$wear_apk_path" dist/apk/ConfNav-wear-release.apk
          aab_path="$(find app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' -print -quit)"
          test -n "$aab_path" || { echo "No release AAB was produced"; exit 1; }
          cp "$aab_path" dist/play/ConfNav-release.aab
          wear_aab_path="$(find wear/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' -print -quit)"
          test -n "$wear_aab_path" || { echo "No Wear OS release AAB was produced"; exit 1; }
          cp "$wear_aab_path" dist/play/ConfNav-wear-release.aab
          find dist -type f -empty -print -exec false {} +
          (cd dist/apk && zip -j ../ConfNav-apk.zip *.apk)
          (cd dist/play && zip -j ../ConfNav-google-play-aab.zip *.aab)

      - name: Upload APK package
        uses: actions/upload-artifact@v7
        with:
          name: ConfNav-apk-${{ github.run_number }}
          path: dist/ConfNav-apk.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload Google Play package
        uses: actions/upload-artifact@v7
        with:
          name: ConfNav-google-play-${{ github.run_number }}
          path: dist/ConfNav-google-play-aab.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/ConfNav-apk.zip \
            dist/ConfNav-google-play-aab.zip \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
