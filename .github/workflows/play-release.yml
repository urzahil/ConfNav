name: Release to Google Play closed testing

# Bumps versionCode (phone and Wear OS), builds signed AABs, commits and tags the bump,
# uploads both bundles to Google Play closed testing and publishes a GitHub Release.

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'New versionName (e.g. 1.11.3). Leave empty to keep the current one.'
        required: false
        default: ''
      phone_track:
        description: 'Play track for the phone bundle (alpha is the default closed testing track)'
        required: true
        default: 'alpha'
      wear_track:
        description: 'Play track for the Wear OS bundle'
        required: true
        default: 'wear:alpha'

permissions:
  contents: write

concurrency:
  group: play-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Require a branch
        if: github.ref_type != 'branch'
        run: |
          echo "::error::Run this workflow from a branch (normally main), not a tag."
          exit 1

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate release secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD MAPS_API_KEY PLAY_SERVICE_ACCOUNT_JSON; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required repository secret $name is not configured."
              exit 1
            fi
          done

      - name: Bump versionCode and versionName
        id: version
        shell: bash
        env:
          VERSION_NAME_INPUT: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          current_code="$(sed -nE 's/^ *versionCode = ([0-9]+)$/\1/p' app/build.gradle.kts)"
          current_name="$(sed -nE 's/^ *versionName = "([^"]+)"$/\1/p' app/build.gradle.kts)"
          [[ -n "$current_code" && -n "$current_name" ]] || { echo "::error::Could not read version from app/build.gradle.kts"; exit 1; }

          new_code=$((current_code + 1))
          # Keep the Wear OS offset documented in wear/build.gradle.kts.
          wear_code=$((new_code + 1000000))
          wear_code_literal="$(printf '%d' "$wear_code" | sed -E ':a;s/([0-9])([0-9]{3})($|_)/\1_\2\3/;ta')"
          new_name="${VERSION_NAME_INPUT:-$current_name}"
          [[ "$new_name" =~ ^[0-9A-Za-z._-]+$ ]] || { echo "::error::Invalid versionName: $new_name"; exit 1; }

          sed -i -E "s/^( *versionCode = )[0-9]+$/\1$new_code/" app/build.gradle.kts
          sed -i -E "s/^( *versionCode = )[0-9_]+$/\1$wear_code_literal/" wear/build.gradle.kts
          sed -i -E "s/^( *versionName = )\"[^\"]+\"$/\1\"$new_name\"/" app/build.gradle.kts wear/build.gradle.kts

          grep -q "versionCode = $new_code$" app/build.gradle.kts
          grep -q "versionCode = $wear_code_literal$" wear/build.gradle.kts
          git diff --stat

          tag="v$new_name-$new_code"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "::error::Tag $tag already exists."
            exit 1
          fi
          echo "code=$new_code" >> "$GITHUB_OUTPUT"
          echo "name=$new_name" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing $new_name (phone $new_code, wear $wear_code)" >> "$GITHUB_STEP_SUMMARY"

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -eu
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.p12"
          test -s "$RUNNER_TEMP/release.p12"

      - name: Configure Google Maps API key
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: printf 'MAPS_API_KEY=%s\n' "$MAPS_API_KEY" > .env

      - name: Build signed release APKs and AABs
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.p12
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew clean testDebugUnitTest assembleRelease bundleRelease --no-daemon

      - name: Prepare release packages
        run: |
          set -eu
          mkdir -p dist/apk dist/play
          cp "$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)" dist/apk/ConfNav-release.apk
          cp "$(find wear/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)" dist/apk/ConfNav-wear-release.apk
          cp "$(find app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' -print -quit)" dist/play/ConfNav-release.aab
          cp "$(find wear/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' -print -quit)" dist/play/ConfNav-wear-release.aab
          find dist -type f -empty -print -exec false {} +
          (cd dist/apk && zip -j ../ConfNav-apk.zip *.apk)
          (cd dist/play && zip -j ../ConfNav-google-play-aab.zip *.aab)

      # Pushed before uploading: a versionCode committed but never uploaded is harmless,
      # whereas one uploaded but not committed would make the next run collide on Play.
      - name: Commit and tag version bump
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts wear/build.gradle.kts
          git commit -m "chore: release $VERSION_NAME (versionCode $VERSION_CODE)"
          git tag "$TAG"
          git push origin "HEAD:$GITHUB_REF_NAME" "refs/tags/$TAG"

      - name: Upload phone bundle to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: rocks.urzahil.confnav
          releaseFiles: dist/play/ConfNav-release.aab
          mappingFile: app/build/outputs/mapping/release/mapping.txt
          releaseName: ${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})
          track: ${{ inputs.phone_track }}
          status: completed

      - name: Upload Wear OS bundle to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: rocks.urzahil.confnav
          releaseFiles: dist/play/ConfNav-wear-release.aab
          mappingFile: wear/build/outputs/mapping/release/mapping.txt
          releaseName: ${{ steps.version.outputs.name }} Wear (${{ steps.version.outputs.code }})
          track: ${{ inputs.wear_track }}
          status: completed

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          gh release create "$TAG" \
            dist/ConfNav-apk.zip \
            dist/ConfNav-google-play-aab.zip \
            --generate-notes \
            --title "ConfNav $VERSION_NAME ($VERSION_CODE)"
